{% extends "layout.html" %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
<script src="{{ url_for('static', filename='js/map.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/create_post.js') }}" defer></script>
<script>
    const REGIONS_URL = "{{ url_for('static', filename='data/building_polygons_4326.geojson') }}";
</script>
{% endblock %}

{% block header %}
<div class="pure-u-1-2 blog-controls">
    <div class="pure-u-1-2">
        <a href="/map" class="site-logo">
            <img src="{{ url_for('static', filename='images/geoblog-logo.png') }}" alt="GeoBloggr logo">
            <span>GeoBloggr</span>
        </a>
    </div>
</div>
{% endblock %}

{% block body %}
<div id="map_page" class="pure-g" data-user-logged-in="{{ 'true' if logged_in else 'false' }}">
    <div id="sidebar" hidden>
        <form action="/map" method="get" class="pure-form" id="mapSearchForm">
            <div class="map-search-row">
                <div class="map-search">
                    <input type="text" id="search" name="search" aria-label="Search posts" placeholder="Search posts">
                    <button type="submit" aria-label="Search">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
                <button type="button" id="filterToggle" aria-label="Filter">
                    <i class="fa fa-sliders"></i> 
                </button>
            </div>

            <div id="filterPanel" hidden>
                <div class="filter-row">
                    <label for="location">Location
                        <input type="text" id="location" name="location" placeholder="Any">
                    </label>
                    <label for="user">User
                        <input type="text" id="user" name="user" placeholder="Any">
                    </label>
                </div>
                <label for="date-range">Date range
                    <select id="date-range" name="date-range">
                        <option value="any">Anytime</option>
                        <option value="today">Last 24 Hours</option>
                        <option value="week">Last Week</option>
                        <option value="month">Last Month</option>
                    </select>
                </label>
                <div class="filter-actions">
                    <button type="submit" class="pure-button apply-btn">Apply filters</button>
                    <a href="/map">Clear</a>
                </div>
            </div>
        </form>

        {% for id in postIds %}

        <input type="hidden" id="{{id}}" class="post_ids">

        {% endfor %}

        <div id="postCount"></div>
        <div id="sideBarPosts"></div>
    </div>
    
    <div id="mapContainer">
        <button id="sidebarToggle" class="pure-button" onclick="adjustSideBar()">></button>
        <div id="map"></div>
        <div class="popupBackground" id="createPopupBackground" hidden>
            <div class="popupWindow" id="createPopupWindow">
                <div class="popups">
                    
                    {% set location_mode = 'map' %}
                    {% include "create_post.html" %}

                    <div class="popup" id="post" hidden>
                        <h1 id="postTitle"></h1>
                        <p id="postAuthor"></p>
                        <p id="postDescription"></p>
                        <p id="postLocation"></p>
                        <img src="" alt="" id="postImage" hidden>
                        <p id="postDate"></p>
                        <p id="post_id" hidden></p>
                        <div id="postActions" hidden>
                            <a id="editLink" class="pure-button" href="#">Edit</a>
                            <form id="deleteForm" method="post" style="display:inline"
                                onsubmit="return confirm('Delete this post?')">
                                <button class="pure-button">Delete</button>
                            </form>
                        </div>
                        <button id="viewCommentsButton" class="pure-button" href="/post/id">View Comments</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
