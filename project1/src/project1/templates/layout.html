<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GeoBloggr</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css"
        integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
    {% block scripts %}{% endblock %}
</head>

<body>
    <header class="pure-g"> 
        <div class="pure-u-1-2 blog-controls">
            <div class="pure-u-1-2">
                <a href="/map" class="site-logo">
                    <img src="{{ url_for('static', filename='images/geoblog-logo.png') }}" alt="GeoBloggr logo">
                    <span>GeoBloggr</span>
                </a>
            </div>
        </div>
        <div class="pure-u-1-2">
            <div id="menu" class="pure-menu pure-menu-horizontal">
                {% if not request.path.startswith('/map') and request.path != '/' %}
                    <a href="/map" class="pure-menu-item pure-menu-link">Map</a>
                {% endif %}
                {% if not request.path.startswith('/blog') %}
                    <a href="/blog" class="pure-menu-item pure-menu-link">Blog</a>
                {% endif %}
                {% if session.user_token %}
                    <a href="/logout" class="pure-menu-item pure-menu-link">Log Out</a>
                {% else %}
                    <a href="/login" class="pure-menu-item pure-menu-link" >Log In</a>
                {% endif %}
            </div>
        </div>
    </header>
    {% block body %}{% endblock %}
</body>
