{% extends "layout.html" %}

{% block scripts %}
<link href="{{ url_for('static', filename='css/blog.css') }}" rel="stylesheet">
<script src="{{ url_for('static', filename='js/blog.js') }}" defer></script>
{% endblock %}


{% block header %}
<div id="searchBar" class="pure-u-1-2">
    <form action="/search" method="post" class="pure-form">
        <input type="text" class="pure-input-rounded" aria-label="Search" />
        <input type="submit" class="pure-input-rounded pure-button" />
    </form>
</div>

<button type="button" id="filterToggleBtn" class="pure-button">Filter</button>

{#<label for="mode">View</label>#}

<select name="mode" id="mode">
    <option value="view">View</option>
    <option value="edit">Edit</option>
    <option value="delete">Delete</option>
    <option value="create">Create</option>
</select>

{% endblock %}


{% block body %}

<div id="filterSidebar" class="sidebar">
    <div class="sidebar-header">
        <h2>Filter</h2>
        <button type="button" id="closeSidebarBtn" class="pure-button">X</button>
    </div>

    <form id="filterForm" action="/filter" method="get" class="pure-form pure-form-stacked">
        <fieldset>
            <label for="location">Location</label>
            <input type="text" id="location" name="location" class="pure-input-1" placeholder="e.g. Bruininks Hall">

            <label for="radius">Location Radius (miles)</label>
            <input type="range" id="radius" name="radius" class="pure-input-1" min="1" max="100" value="10"
                oninput="this.nextElementSibling.value = this.value">
            <output>10</output> miles

            <label for="user">User</label>
            <input type="text" id="user" name="user" class="pure-input-1" placeholder="@username">

            <label for="date-range">Date</label>
            <select id="date-range" name="date-range" class="pure-input-1">
                <option value="any">Anytime</option>
                <option value="today">Last 24 Hours</option>
                <option value="week">Last Week</option>
                <option value="month">Last Month</option>
            </select>

            <button type="submit" class="pure-button pure-button-primary pure-input-1" style="margin-top: 15px;">Apply
                Filters</button>
        </fieldset>
    </form>
</div>

<div id="blog_page">
    <p>blog page</p>
</div>
{% endblock %}
